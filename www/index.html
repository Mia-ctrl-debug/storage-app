<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>储物清单</title>
<style>
  :root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --text: #1a1d29;
    --text-muted: #6b7280;
    --text-light: #9ca3af;
    --border: #eceef3;
    --border-strong: #e0e3eb;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-soft: #eff6ff;
    --primary-grad: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --warning: #f59e0b;
    --warning-soft: #fffbeb;
    --warning-border: #fde68a;
    --success: #10b981;
    --success-soft: #ecfdf5;
    --radius: 16px;
    --shadow-card: 0 1px 2px rgba(24,30,45,0.04), 0 2px 6px rgba(24,30,45,0.04);
    --shadow-fab: 0 10px 26px rgba(59,130,246,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  body.selecting { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }

  header {
    position: sticky; top: 0; background: #fff; padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border); z-index: 10;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 {
    font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.3px;
    background: var(--primary-grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  #stats { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  #stats .stat-danger { color: var(--danger); font-weight: 600; }
  #stats .stat-warning { color: var(--warning); font-weight: 600; }
  .header-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-muted); cursor: pointer; flex: none;
    font-family: inherit; transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:active { background: #f3f4f6; }
  .icon-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .search-wrap { position: relative; margin-top: 12px; }
  .search-wrap::before {
    content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; opacity: 0.5; pointer-events: none;
  }
  #search {
    width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--border);
    border-radius: 12px; font-size: 14px; background: #f7f8fb; color: var(--text);
    font-family: inherit; transition: border-color .15s, box-shadow .15s, background .15s;
    -webkit-appearance: none; appearance: none;
  }
  #search:focus { outline: none; background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.14); }

  .filter-bar { display: flex; gap: 6px; margin-top: 10px; }
  .filter-btn {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    padding: 9px 8px; border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text-muted); font-size: 12.5px;
    font-family: inherit; font-weight: 500; cursor: pointer;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .filter-btn:active { background: #f3f4f6; }
  .filter-btn.active {
    background: var(--primary-soft); border-color: #bfdbfe;
    color: var(--primary); font-weight: 600;
  }
  .filter-btn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .filter-btn-arrow { font-size: 9px; opacity: 0.7; flex: none; }

  .filter-option {
    display: flex; align-items: center; gap: 8px; padding: 11px 12px;
    border: none; background: transparent; border-radius: 10px;
    font-size: 14px; color: var(--text); font-family: inherit;
    text-align: left; cursor: pointer; transition: background .12s;
    flex: 1; min-width: 0;
  }
  .filter-option:active { background: #f3f4f6; }
  .filter-option.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .filter-option-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filter-option-check { flex: none; color: var(--primary); font-weight: 700; font-size: 14px; opacity: 0; }
  .filter-option.active .filter-option-check { opacity: 1; }

  .filter-row { display: flex; align-items: stretch; margin-bottom: 2px; }
  .filter-row[data-depth="1"] { padding-left: 18px; }
  .filter-row[data-depth="2"] { padding-left: 36px; }

  .filter-expand {
    flex: none; width: 30px; border: none; background: transparent;
    color: var(--text-light); font-size: 12px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, color .12s;
    border-radius: 8px; font-family: inherit;
  }
  .filter-expand.expanded { transform: rotate(90deg); color: var(--primary); }
  .filter-expand.empty { visibility: hidden; pointer-events: none; }
  .filter-expand:active { background: #f3f4f6; }

  .filter-row[data-depth="0"] .filter-option-label { font-weight: 600; }
  .filter-row[data-depth="1"] .filter-option-label { font-weight: 500; }
  .filter-row[data-depth="2"] .filter-option-label { font-weight: 400; color: var(--text-muted); }
  .filter-row[data-depth="2"] .filter-option.active .filter-option-label { color: var(--primary); }

  main { padding: 14px 16px 20px; max-width: 720px; margin: 0 auto; }

  .banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; background: var(--warning-soft); border: 1px solid var(--warning-border);
    border-radius: 12px; font-size: 13px; color: #92400e; margin-bottom: 14px;
  }
  .banner button {
    padding: 5px 12px; border-radius: 8px; border: 1px solid #f59e0b;
    background: #fff; color: #92400e; font-size: 13px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .banner.hidden { display: none; }

  #alertBox { margin-bottom: 14px; }
  .alerts-title {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; padding-left: 2px;
  }
  .alert-item {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-radius: 10px; font-size: 13px; margin-bottom: 6px;
  }
  .alert-item::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .alert-item.expired { background: var(--danger-soft); color: #991b1b; }
  .alert-item.expired::before { background: var(--danger); }
  .alert-item.soon { background: var(--warning-soft); color: #92400e; }
  .alert-item.soon::before { background: var(--warning); }

  .item-card {
    position: relative; background: var(--card); border-radius: var(--radius);
    padding: 14px 14px 14px 18px; margin-bottom: 10px;
    box-shadow: var(--shadow-card); overflow: hidden;
    transition: box-shadow .15s;
    outline: 2px solid transparent; outline-offset: -2px;
  }
  .item-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #e5e7eb; }
  .item-card.status-expired::before { background: var(--danger); }
  .item-card.status-soon::before { background: var(--warning); }
  .item-card.status-ok::before { background: var(--success); }
  .item-card.status-none::before { background: #cbd5e1; }
  .item-card.collapsed { padding-top: 12px; padding-bottom: 12px; }
  .item-card.selected { outline-color: var(--primary); background: var(--primary-soft); }

  .item-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; cursor: pointer; user-select: none;
  }
  .head-main { flex: 1; min-width: 0; }
  .item-name {
    font-size: 15px; font-weight: 600; margin: 0; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-meta {
    font-size: 12px; color: var(--text-muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .head-right { display: flex; align-items: center; gap: 8px; flex: none; padding-top: 1px; }
  .chevron {
    color: var(--text-light); font-size: 11px; line-height: 1;
    transition: transform .2s ease;
    width: 20px; height: 20px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    background: #f3f4f6;
  }
  .item-card.collapsed .chevron { transform: rotate(-90deg); }

  .item-checkbox {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid #d1d5db; background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex: none; transition: background .12s, border-color .12s;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .item-checkbox.checked { background: var(--primary); border-color: var(--primary); }

  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 600; flex: none; }
  .badge.expired { background: var(--danger-soft); color: #991b1b; }
  .badge.soon { background: var(--warning-soft); color: #92400e; }
  .badge.ok { background: var(--success-soft); color: #065f46; }
  .badge.none { background: #f3f4f6; color: #6b7280; }

  .item-body { overflow: hidden; }
  .item-card.collapsed .item-body { display: none; }

  .qty-control {
    display: inline-flex; align-items: center; gap: 4px;
    background: #f7f8fb; border-radius: 12px; padding: 3px;
    margin-top: 10px;
  }
  .btn-qty {
    width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; line-height: 1;
    border-radius: 9px; border: none;
    background: #fff; color: var(--text);
    cursor: pointer; font-family: inherit;
    box-shadow: 0 1px 2px rgba(24,30,45,0.06);
    transition: background .12s, transform .1s, color .12s;
  }
  .btn-qty:active { background: var(--primary); color: #fff; transform: scale(0.94); }
  .qty-value {
    min-width: 52px; text-align: center;
    font-size: 15px; font-weight: 600; color: var(--text);
    padding: 0 4px;
  }
  .qty-value small { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 2px; }

  .expiry-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 13px; color: var(--text-muted);
  }
  .expiry-row::before { content: '⏱'; font-size: 13px; opacity: 0.65; }
  .expiry-row .expiry-label { color: var(--text-light); }
  .expiry-row .expiry-date { color: var(--text); font-weight: 500; }

  .item-note { font-size: 13px; color: var(--text-muted); margin: 9px 0 0; line-height: 1.45; }
  .item-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .btn-mini {
    padding: 6px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: #fff; font-size: 13px; color: var(--text); font-family: inherit;
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  .btn-mini:active { background: #f3f4f6; }
  .btn-mini.btn-danger { color: var(--danger); border-color: #fecaca; background: #fff; }
  .btn-mini.btn-danger:active { background: var(--danger-soft); }

  .empty { text-align: center; color: var(--text-light); padding: 60px 20px; font-size: 14px; }
  .empty-icon { font-size: 44px; margin-bottom: 14px; opacity: 0.7; }
  .empty-sub { font-size: 13px; margin-top: 6px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--primary-grad); color: #fff;
    border: none; font-size: 28px; line-height: 1;
    box-shadow: var(--shadow-fab); cursor: pointer; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s;
  }
  .fab:active { transform: scale(0.93); }
  .fab.hidden { display: none; }

  .modal {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100;
    animation: fadeIn .18s ease;
  }
  .modal.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet {
    background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slideUp .22s cubic-bezier(0.16, 1, 0.3, 1); -webkit-overflow-scrolling: touch;
    will-change: transform;
  }
  .sheet-handle {
    width: 40px; height: 4px; border-radius: 2px; background: #e5e7eb;
    margin: 6px auto 14px;
    cursor: grab;
  }
  .sheet h2 { font-size: 17px; font-weight: 700; margin: 0 0 14px; }
  .sheet h3 {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.4px; margin: 18px 0 8px;
  }

  .modal.dialog-center { align-items: center; padding: 24px; z-index: 300; }
  .modal.dialog-center .sheet {
    border-radius: 18px; padding: 20px; max-width: 380px; max-height: 80vh;
    animation: dialogPop .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes dialogPop {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }
  .dialog-message { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0; word-break: break-word; }
  .dialog-input {
    display: block; width: 100%; margin-top: 14px; padding: 11px 12px;
    border: 1px solid var(--border-strong); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  .dialog-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.14); }

  /* ============ 数据面板 ============ */
  .data-stats { text-align: center; color: var(--text-muted); font-size: 13px; margin: -6px 0 18px; }
  .data-stats strong { color: var(--text); font-weight: 600; }

  .data-tabs {
    display: flex; gap: 4px; background: #f3f4f6;
    border-radius: 12px; padding: 4px; margin-bottom: 10px;
  }
  .data-tab {
    flex: 1; padding: 10px 8px; border: none; background: transparent;
    border-radius: 9px; font-size: 13.5px; font-family: inherit;
    color: var(--text-muted); cursor: pointer; font-weight: 500;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .data-tab.active {
    background: #fff; color: var(--text); font-weight: 600;
    box-shadow: 0 1px 3px rgba(24,30,45,0.08);
  }
  .data-format-hint {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin: 0 0 16px; min-height: 16px;
  }

  .btn-hero {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; font-size: 16px; font-weight: 600;
    border-radius: 14px; border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-family: inherit;
    transition: background .12s;
  }
  .btn-hero:active { background: var(--primary-hover); }

  .export-log {
    margin-top: 14px;
    background: #f7f8fb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .export-log.ok { background: var(--success-soft); color: #065f46; }
  .export-log.warn { background: var(--warning-soft); color: #92400e; }

  .manual-copy-box {
    margin-top: 14px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }
  .manual-copy-summary {
    padding: 12px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    list-style: none;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .manual-copy-summary::-webkit-details-marker { display: none; }
  .manual-copy-summary::before {
    content: '▸';
    display: inline-block;
    transition: transform .18s ease;
    font-size: 11px;
  }
  .manual-copy-box[open] .manual-copy-summary::before { transform: rotate(90deg); }
  .manual-copy-tip {
    padding: 0 14px 10px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.55;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .manual-copy-tip b { color: var(--text); }
  .manual-copy-textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px 14px;
    border: none;
    border-top: 1px solid var(--border);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    background: #fbfcfe;
    color: var(--text);
    -webkit-appearance: none;
    appearance: none;
    resize: vertical;
    box-sizing: border-box;
    display: block;
    user-select: text;
    -webkit-user-select: text;
  }
  .manual-copy-textarea:focus { outline: none; background: #fff; }

  .data-footer-hint {
    font-size: 12px; color: var(--text-light); text-align: center;
    margin-top: 14px; line-height: 1.6;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: block; }
  .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong);
    border-radius: 10px; font-size: 15px; background: #fff; color: var(--text);
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none; appearance: none;
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.14);
  }
  .field input::placeholder, .field textarea::placeholder { color: #c7cbd1; }

  .path-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .path-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .path-row > *, .path-row-3 > * { min-width: 0; }
  .path-row-3 input { font-size: 14px; padding: 10px 10px; }

  .quick-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .quick-chips:empty { display: none; }
  .quick-chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #f3f4f6; color: #4b5563; border: 1px solid transparent;
    cursor: pointer; font-family: inherit; line-height: 1.5;
    transition: background .12s, color .12s, border-color .12s;
  }
  .quick-chip:active { background: #e5e7eb; }
  .quick-chip.active { background: var(--primary-soft); color: var(--primary); border-color: #bfdbfe; font-weight: 500; }

  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-strong);
    background: #fff; font-size: 15px; font-family: inherit; color: var(--text);
    cursor: pointer; font-weight: 500; transition: background .12s;
  }
  .btn:active { background: #f3f4f6; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
  .btn-primary:active { background: var(--primary-hover); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 600; }
  .btn-danger:active { background: #b91c1c; }
  .btn-full { width: 100%; }

  .menu-list { display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    border: none; background: transparent; border-radius: 12px; font-size: 15px;
    color: var(--text); font-family: inherit; text-align: left; cursor: pointer;
    width: 100%; transition: background .12s;
  }
  .menu-item:active { background: #f3f4f6; }
  .menu-icon {
    width: 30px; height: 30px; border-radius: 8px; background: #f3f4f6;
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none;
  }
  .menu-item.menu-danger { color: var(--danger); }
  .menu-item.menu-danger .menu-icon { background: var(--danger-soft); }

  .setting-row { background: #f7f8fb; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .setting-row label { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 0; cursor: pointer; }
  .setting-row input[type="checkbox"] { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--primary); }
  .hint { font-size: 12px; color: var(--text-muted); margin: 6px 0 12px; line-height: 1.55; }

<script>
/* ===================== Capacitor 原生桥接 ===================== */
const isCapacitor = !!(window.Capacitor &&
                       typeof window.Capacitor.isNativePlatform === 'function' &&
                       window.Capacitor.isNativePlatform());

/**
 * 仅保存到手机存储，不弹任何系统 UI。
 */
async function saveFileLocal(content, filename) {
  if (!isCapacitor) return null;
  const Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const Filesystem = Plugins.Filesystem;
  if (!Filesystem) return null;

  const attempts = [
    { dir: 'EXTERNAL',  label: '手机存储/Android/data/.../files/储物清单' },
    { dir: 'DOCUMENTS', label: 'App 内部文档目录' }
  ];

  for (const a of attempts) {
    try {
      const result = await Filesystem.writeFile({
        path: '储物清单/' + filename,
        data: content,
        directory: a.dir,
        encoding: 'utf8',
        recursive: true
      });
      return { uri: result.uri, directory: a.dir, hint: a.label + '/' + filename };
    } catch (e) {
      console.warn('[Capacitor] 写入 ' + a.dir + ' 失败：', e);
    }
  }
  return null;
}

/**
 * 保存到手机 + 调起系统分享
 */
async function shareNativeFile(content, filename, mime) {
  if (!isCapacitor) return null;
  const Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const Filesystem = Plugins.Filesystem;
  const Share = Plugins.Share;
  if (!Filesystem || !Share) return null;

  try {
    const writeResult = await Filesystem.writeFile({
      path: '储物清单/' + filename,
      data: content,
      directory: 'EXTERNAL',
      encoding: 'utf8',
      recursive: true
    });
    await Share.share({
      title: filename,
      url: writeResult.uri,
      dialogTitle: '保存或分享备份文件'
    });
    return writeResult.uri;
  } catch (e) {
    console.warn('[Capacitor] 分享失败：', e);
    return null;
  }
}
/* ============================================================ */

const STORAGE_KEY = 'my_items_v1';
const SNAPSHOT_KEY = 'my_items_snapshots_v1';
const SETTINGS_KEY = 'my_items_settings_v1';
const EXPANDED_KEY = 'my_items_expanded_v1';
const TAXONOMY_KEY = 'my_items_taxonomy_v1';
const AUTO_BACKUP_KEY = 'my_items_auto_backup_v1';
const MAX_SNAPSHOTS = 5;
const AUTO_DOWNLOAD_GAP = 30 * 60 * 1000;
const SNAPSHOT_GAP = 60 * 1000;
const BACKUP_REMIND_DAYS = 7;

const CATEGORY_LEVELS = 3;
const LOCATION_LEVELS = 3;

let items = loadItems();
let settings = loadSettings();
let expandedIds = loadExpanded();
let taxonomy = loadTaxonomy();
let editingId = null;
let dataChangedSinceExport = false;
let lastSnapshotAt = 0;
let lastAutoDownloadAt = 0;
let manageTab = 'category';
let selectionMode = false;
let selectedIds = new Set();
let batchEditField = null;
let exportFormat = 'json';

let filterState = { category: '', location: '', expiry: '' };
let currentFilterType = 'category';
let expandedFilterPaths = new Set();

const $ = id => document.getElementById(id);

function loadItems() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; } }
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    return {
      autoDownloadOnExit: !!s.autoDownloadOnExit,
      lastExportAt: s.lastExportAt || null,
      alertOnOpen: s.alertOnOpen !== false
    };
  } catch (e) {
    return { autoDownloadOnExit: false, lastExportAt: null, alertOnOpen: true };
  }
}
function loadExpanded() { try { return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY)) || []); } catch (e) { return new Set(); } }
function loadTaxonomy() {
  try {
    const t = JSON.parse(localStorage.getItem(TAXONOMY_KEY)) || {};
    return { categories: Array.isArray(t.categories) ? t.categories : [], locations: Array.isArray(t.locations) ? t.locations : [] };
  } catch (e) {
    return { categories: [], locations: [] };
  }
}
function saveExpanded() { try { localStorage.setItem(EXPANDED_KEY, JSON.stringify(Array.from(expandedIds))); } catch (e) {} }
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function saveTaxonomy() { localStorage.setItem(TAXONOMY_KEY, JSON.stringify(taxonomy)); }
function saveItems() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); dataChangedSinceExport = true; render(); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function localDateStr(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function localDateTimeStr(date = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}${p(date.getMonth()+1)}${p(date.getDate())}_${p(date.getHours())}${p(date.getMinutes())}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(localDateStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  if (isNaN(target.getTime())) return null;
  return Math.ceil((target - today) / 86400000);
}
function expiryStatus(item) {
  const d = daysUntil(item.expiry);
  if (d === null) return { key: 'none', label: '无到期', cls: 'none' };
  const remind = Number(item.remindDays) || 0;
  if (d < 0) return { key: 'expired', label: `已过期${Math.abs(d)}天`, cls: 'expired' };
  if (d <= remind) return { key: 'soon', label: `${d}天后到期`, cls: 'soon' };
  return { key: 'ok', label: `${d}天后到期`, cls: 'ok' };
}

function showToast(msg, duration) {
  duration = duration || 2500;
  const old = document.getElementById('appToast');
  if (old) old.remove();
  const toast = document.createElement('div');
  toast.id = 'appToast';
  toast.textContent = msg;
  toast.style.cssText = [
    'position:fixed', 'left:50%', 'bottom:110px',
    'transform:translateX(-50%)',
    'background:rgba(26,29,41,0.94)', 'color:#fff',
    'padding:10px 18px', 'border-radius:10px',
    'font-size:14px', 'z-index:9999',
    'max-width:80%', 'text-align:center',
    'box-shadow:0 4px 16px rgba(0,0,0,0.2)',
    'animation:toastIn .2s ease',
    'pointer-events:none'
  ].join(';');
  document.body.appendChild(toast);
  setTimeout(function () {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity .3s';
    setTimeout(function () { toast.remove(); }, 320);
  }, duration);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

let uiDialogResolve = null;

function uiDialog(config) {

    sheet.querySelectorAll('button[data-idx]').forEach(btn => {

    });

async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;padding:0;border:none;background:transparent;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  if (ok) return true;
  throw new Error('copy failed');
}

/* ===================== 多路文件保存（Web 兜底） ===================== */
async function tryAllSaveMethods(content, filename, mime) {

  // ★ 优先走 Capacitor 原生（仅保存，不弹分享）
  const localResult = await saveFileLocal(content, filename);
  if (localResult) return { ok: true, method: 'native-local', hint: localResult.hint };

  // ① navigator.share with files
  if (typeof navigator.share === 'function') {
    try {
      const blob = new Blob([content], { type: mime });
      let file = null;
      try { file = new File([blob], filename, { type: mime }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return { ok: true, method: 'share-file' };
      }
      try {
        await navigator.share({ title: filename, text: content });
        return { ok: true, method: 'share-text' };
      } catch (e2) {
        if (e2 && e2.name === 'AbortError') return { ok: false, method: 'cancelled' };
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, method: 'cancelled' };
    }
  }

  // ② File System Access API
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const ext = '.' + filename.split('.').pop();
      const cleanMime = String(mime || '').split(';')[0];
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: '文件', accept: { [cleanMime]: [ext] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(new Blob([content], { type: mime }));
      await writable.close();
      return { ok: true, method: 'filesystem' };
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, method: 'cancelled' };
    }
  }

  // ③ a.download + blob URL
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {}
    }, 2000);
  } catch (e) {}

  // ④ a.download + data URL
  if (content.length < 2 * 1024 * 1024) {
    try {
      const dataUrl = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(content);
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { try { document.body.removeChild(a); } catch (e) {} }, 2000);
    } catch (e) {}
  }

  // ⑤ iframe + blob URL
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;';
    iframe.src = url;
    document.body.appendChild(iframe);
    setTimeout(() => {
      try { document.body.removeChild(iframe); URL.revokeObjectURL(url); } catch (e) {}
    }, 3000);
  } catch (e) {}

  // ★ 删除 window.open（会导致 WebView 中无法返回）

  return { ok: true, method: 'download-blob' };
}

const suggestPanels = new Map();

function attachSuggest(inputId, getOptions, maxVisible) {
  maxVisible = maxVisible || 8;
  const input = document.getElementById(inputId);
  if (!input) return;

  const panel = document.createElement('div');
  panel.className = 'suggest-panel hidden';
  document.body.appendChild(panel);

  let currentOptions = [];
  let activeIdx = -1;

  function position() {
    if (panel.classList.contains('hidden')) return;
    const rect = input.getBoundingClientRect();
    const panelH = Math.min(panel.scrollHeight, 240);
    const spaceBelow = window.innerHeight - rect.bottom - 8;
    const spaceAbove = rect.top - 8;

    panel.style.left = rect.left + 'px';
    panel.style.width = rect.width + 'px';

    if (spaceBelow < panelH && spaceAbove > spaceBelow) {
      panel.style.top = 'auto';
      panel.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    } else {
      panel.style.top = (rect.bottom + 4) + 'px';
      panel.style.bottom = 'auto';
    }
  }

  function render() {
    const val = input.value.trim().toLowerCase();
    const all = getOptions() || [];

    currentOptions = all.filter(o => {
      if (!val) return true;
      return String(o).toLowerCase().includes(val);
    });

    if (!currentOptions.length) {
      if (val) {
        panel.innerHTML = '<div class="suggest-empty">无匹配</div>';
        panel.classList.remove('hidden');
        position();
      } else {
        panel.classList.add('hidden');
      }
      return;
    }

    const shown = currentOptions.slice(0, 30);
    panel.innerHTML = shown.map((o, i) =>
      `<div class="suggest-item" data-idx="${i}">${escapeHtml(o)}</div>`
    ).join('');
    activeIdx = -1;
    panel.classList.remove('hidden');
    position();
  }

  function hide() {
    panel.classList.add('hidden');
    activeIdx = -1;
  }

  function select(idx) {
    if (idx < 0 || idx >= currentOptions.length) return;
    input.value = currentOptions[idx];
    hide();
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.focus();
  }

  input.addEventListener('focus', () => { render(); });
  input.addEventListener('input', render);

  input.addEventListener('blur', () => {
    setTimeout(() => {
      if (!panel.contains(document.activeElement)) hide();
    }, 180);
  });

  input.addEventListener('keydown', e => {
    const isOpen = !panel.classList.contains('hidden');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!isOpen) { render(); return; }
      const items = panel.querySelectorAll('.suggest-item');
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const items = panel.querySelectorAll('.suggest-item');
      activeIdx = Math.max(activeIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (isOpen && activeIdx >= 0) {
        e.preventDefault();
        select(activeIdx);
      }
    } else if (e.key === 'Escape') {
      hide();
    }
  });

  panel.addEventListener('mousedown', e => {
    e.preventDefault();
    const item = e.target.closest('.suggest-item');
    if (!item) return;
    select(Number(item.dataset.idx));
  });

  panel.addEventListener('touchstart', e => {
    const item = e.target.closest('.suggest-item');
    if (!item) return;
    e.preventDefault();
    select(Number(item.dataset.idx));
  }, { passive: false });

  document.addEventListener('scroll', () => {
    if (!panel.classList.contains('hidden')) position();
  }, true);
  window.addEventListener('resize', () => {
    if (!panel.classList.contains('hidden')) position();
  });

  suggestPanels.set(inputId, { panel, getOptions, hide });
  return { panel, hide };
}

function hideAllSuggests() {
  suggestPanels.forEach(({ panel }) => panel.classList.add('hidden'));
}

/* ===================== 路径工具 ===================== */
function extractParts(path, levels) {
  const raw = String(path || '').split('/').map(s => s.trim()).filter(Boolean);
  const result = new Array(levels).fill('');
  if (raw.length === 0) return result;
  for (let i = 0; i < levels - 1; i++) result[i] = raw[i] || '';
  result[levels - 1] = raw.slice(levels - 1).join('/');
  return result;
}
function joinParts(parts) {
  return (parts || []).map(s => String(s || '').trim()).filter(Boolean).join('/');
}
function displayPath(p) {
  return String(p || '').split('/').map(x => x.trim()).filter(Boolean).join(' › ');
}
function pathDepth(p) {
  return String(p || '').split('/').map(s => s.trim()).filter(Boolean).length;
}
function childrenAt(paths, parentPath) {
  const set = new Set();
  const parentParts = parentPath ? String(parentPath).split('/').map(s => s.trim()).filter(Boolean) : [];
  paths.forEach(p => {
    const parts = String(p).split('/').map(s => s.trim()).filter(Boolean);
    if (parts.length <= parentParts.length) return;
    for (let i = 0; i < parentParts.length; i++) if (parts[i] !== parentParts[i]) return;
    set.add(parts[parentParts.length]);
  });
  return Array.from(set).sort();
}
function topLevel(paths) { return childrenAt(paths, ''); }
function allCategoryPaths() {
  const set = new Set();
  items.forEach(i => { if (i.category) set.add(i.category); });
  taxonomy.categories.forEach(p => set.add(p));
  return Array.from(set);
}
function allLocationPaths() {
  const set = new Set();
  items.forEach(i => { if (i.location) set.add(i.location); });
  taxonomy.locations.forEach(p => set.add(p));
  return Array.from(set);
}
function buildFilterTree(paths) {
  const root = { children: {} };
  paths.forEach(p => {
    const parts = String(p).split('/').map(s => s.trim()).filter(Boolean);
    if (!parts.length) return;
    let node = root;
    let currentPath = '';
    parts.forEach(part => {
      currentPath = currentPath ? currentPath + '/' + part : part;
      if (!node.children[part]) node.children[part] = { name: part, path: currentPath, children: {} };
      node = node.children[part];
    });
  });
  return root;
}

function takeSnapshot(reason) {
  if (!items.length) return;
  let hash;
  try { hash = JSON.stringify(items); } catch (e) { return; }
  let snaps = [];
  try { snaps = JSON.parse(localStorage.getItem(SNAPSHOT_KEY)) || []; } catch (e) {}
  if (snaps.length && snaps[snaps.length - 1].hash === hash) return;
  snaps.push({ id: uid(), time: new Date().toISOString(), reason: reason || 'auto', hash, items: items.map(i => ({ ...i })) });
  if (snaps.length > MAX_SNAPSHOTS) snaps = snaps.slice(-MAX_SNAPSHOTS);
  while (snaps.length) {
    try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snaps)); return; }
    catch (e) { snaps.shift(); }
  }
}
function getSnapshots() { try { return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)) || []; } catch (e) { return []; } }

async function restoreSnapshot(id) {

}
function formatTime(iso) {

  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}
function renderSnapshots() {

  const total = items.reduce((s, i) => s + (Number(i.quantity) || 0), 0);
  const expired = items.filter(i => expiryStatus(i).key === 'expired').length;
  const soon = items.filter(i => expiryStatus(i).key === 'soon').length;
  const parts = [`${items.length} 种 · ${total} 件`];
  if (expired) parts.push(`<span class="stat-danger">已过期 ${expired}</span>`);
  if (soon) parts.push(`<span class="stat-warning">临期 ${soon}</span>`);
  $('stats').innerHTML = parts.join(' · ');
}
function renderBackupBanner() {
  const banner = $('backupBanner');
  if (!items.length) { banner.classList.add('hidden'); return; }
  const last = settings.lastExportAt ? new Date(settings.lastExportAt) : null;
  const days = last ? Math.floor((Date.now() - last.getTime()) / 86400000) : null;
  if (last && days < BACKUP_REMIND_DAYS) { banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  banner.innerHTML = (last ? `<span>已经 ${days} 天没导出备份了</span>` : `<span>还没有导出过备份</span>`) + `<button id="btnQuickBackup">立即导出</button>`;
  const btn = $('btnQuickBackup'); if (btn) btn.onclick = () => openDataPanel();
}
function renderAlerts() {
  const alerts = items.filter(i => ['expired', 'soon'].includes(expiryStatus(i).key)).sort((a, b) => (a.expiry || '').localeCompare(b.expiry || ''));
  if (!alerts.length) { $('alertBox').innerHTML = ''; return; }
  $('alertBox').innerHTML = `<div class="alerts-title">到期提醒</div>` +
    alerts.slice(0, 6).map(i => {
      const st = expiryStatus(i);
      return `<div class="alert-item ${st.cls}">${escapeHtml(i.name)} · ${escapeHtml(displayPath(i.location) || '未填位置')} · ${st.label}</div>`;
    }).join('');
}

function pathMatches(value, filter) {
  if (!filter) return true;
  const v = (value || '').trim();
  return v === filter || v.startsWith(filter + '/');
}

function getFilteredItems() {
  const q = $('search').value.trim().toLowerCase();
  const cat = filterState.category;
  const loc = filterState.location;
  const exp = filterState.expiry;

  return items.filter(i => {
    if (cat && !pathMatches(i.category, cat)) return false;
    if (loc && !pathMatches(i.location, loc)) return false;
    const st = expiryStatus(i);
    if (exp === 'expired' && st.key !== 'expired') return false;
    if (exp === 'soon' && st.key !== 'soon') return false;
    if (exp === 'hasExpiry' && !i.expiry) return false;
    if (exp === 'none' && i.expiry) return false;
    if (q) {
      const text = [i.name, i.category, i.location, i.note, i.unit].join(' ').toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    if (a.expiry && b.expiry) return a.expiry.localeCompare(b.expiry);
    if (a.expiry) return -1;
    if (b.expiry) return 1;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });
}

function toggleCard(id) {
  if (selectionMode) { toggleSelect(id); return; }
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);

function bindChipBox(boxId, inputId, after) {

function buildManageTree(field) {
  const paths = field === 'category' ? allCategoryPaths() : allLocationPaths();
  const root = { children: {} };
  paths.forEach(p => {
    const parts = String(p).split('/').map(s => s.trim()).filter(Boolean);
    let node = root; let currentPath = '';
    parts.forEach(part => {
      currentPath = currentPath ? currentPath + '/' + part : part;
      if (!node.children[part]) node.children[part] = { name: part, path: currentPath, children: {}, count: 0 };
      node = node.children[part];
    });
  });
  items.forEach(i => {
    const v = (i[field] || '').trim();
    if (!v) return;
    const parts = v.split('/').map(s => s.trim()).filter(Boolean);
    let node = root; let currentPath = '';
    for (const part of parts) {
      currentPath = currentPath ? currentPath + '/' + part : part;
      if (node.children[part]) { node.children[part].count++; node = node.children[part]; }
      else break;
    }
  });
  return root.children;
}
function renderManageNode(node, depth, field) {
  const maxLevels = field === 'category' ? CATEGORY_LEVELS : LOCATION_LEVELS;
  const canAddChild = depth + 1 < maxLevels;
  let html = `<div class="manage-row" data-depth="${depth}">
    <div class="manage-row-main">
      <span class="manage-name">${escapeHtml(node.name)}</span>
      <span class="manage-count">${node.count}</span>
    </div>
    <div class="manage-actions">
      ${canAddChild ? `<button class="btn-icon add-child" data-action="addchild" data-field="${field}" data-path="${escapeHtml(node.path)}" title="在「${escapeHtml(node.name)}」下新增子级">＋</button>` : ''}
      <button class="btn-icon" data-action="rename" data-field="${field}" data-path="${escapeHtml(node.path)}" title="重命名">✎</button>
      <button class="btn-icon danger" data-action="delete" data-field="${field}" data-path="${escapeHtml(node.path)}" title="删除">🗑</button>
    </div>
  </div>`;
  Object.values(node.children).forEach(child => { html += renderManageNode(child, depth + 1, field); });
  return html;
}
function renderManage() {
  const field = manageTab;
  const fieldName = field === 'category' ? '分类' : '位置';
  const tree = buildManageTree(field);
  const list = Object.values(tree).sort((a, b) => a.name.localeCompare(b.name));

  const input = $('manageAddInput');
  if (field === 'category') {
    input.placeholder = '新增分类，如：日用品 或 日用品/清洁用品/洗衣液';
    $('manageHint').textContent = '分类：最多三级，用 / 分隔；也可点每一行右侧的 ＋ 在该级下新增子级。';
  } else {
    input.placeholder = '新增位置，如：卧室 或 卧室/衣柜 或 卧室/衣柜/上层';
    $('manageHint').textContent = '位置：房间，或 房间/柜子，或 房间/柜子/位置，用 / 分隔；也可点每一行右侧的 ＋ 在该级下新增子级。';
  }

  if (!list.length) {
    $('manageContent').innerHTML = `<p class="hint">还没有${fieldName}。在上面输入名称并点「新增」即可创建。</p>`;
    return;
  }
  $('manageContent').innerHTML = `<div class="manage-tree">${
    list.map(node => renderManageNode(node, 0, field)).join('')
  }</div>`;
}
function addManageEntry() {
  const field = manageTab;
  const fieldName = field === 'category' ? '分类' : '位置';
  const input = $('manageAddInput');
  const raw = input.value.trim();
  if (!raw) { showToast(`请输入${fieldName}名称`); return; }
  if (raw.includes('//')) { showToast('不能出现连续的 /'); return; }

  const parts = raw.split('/').map(s => s.trim()).filter(Boolean);
  if (!parts.length) { showToast('名称不能为空'); return; }

  const maxLevels = field === 'category' ? CATEGORY_LEVELS : LOCATION_LEVELS;
  if (parts.length > maxLevels) { showToast(`${fieldName}最多 ${maxLevels} 级`); return; }

  const arr = field === 'category' ? taxonomy.categories : taxonomy.locations;
  const existing = field === 'category' ? allCategoryPaths() : allLocationPaths();
  let added = 0; let currentPath = '';
  parts.forEach(part => {
    currentPath = currentPath ? currentPath + '/' + part : part;
    if (!existing.includes(currentPath)) { arr.push(currentPath); existing.push(currentPath); added++; }
  });

  if (!added) { showToast('该' + fieldName + '已存在'); return; }

  saveTaxonomy();
  input.value = '';
  renderManage();
  render();
  showToast('已新增');
}

async function addChildManagePath(field, parentPath) {
  const fieldName = field === 'category' ? '分类' : '位置';
  const maxLevels = field === 'category' ? CATEGORY_LEVELS : LOCATION_LEVELS;
  const depth = pathDepth(parentPath);
  if (depth >= maxLevels) { showToast(`${fieldName}最多 ${maxLevels} 级`); return; }

  const name = await uiPrompt(
    `在「${displayPath(parentPath)}」下新增${fieldName}`,
    '',
    { title: `新增子级${fieldName}`, placeholder: '请输入名称' }
  );
  if (name === null) return;

  const trimmed = String(name).trim();
  if (!trimmed) { showToast('名称不能为空'); return; }
  if (trimmed.includes('/')) { showToast('名称中不能包含 /'); return; }

  const newPath = parentPath + '/' + trimmed;
  const arr = field === 'category' ? taxonomy.categories : taxonomy.locations;
  const existing = field === 'category' ? allCategoryPaths() : allLocationPaths();

  if (existing.includes(newPath)) {
    if (!arr.includes(newPath)) { arr.push(newPath); saveTaxonomy(); }
    renderManage(); render();
    showToast('该' + fieldName + '已存在');
    return;
  }

  const parts = newPath.split('/').map(s => s.trim()).filter(Boolean);
  let cur = '';
  parts.forEach(p => {
    cur = cur ? cur + '/' + p : p;
    if (!arr.includes(cur)) arr.push(cur);
  });

  saveTaxonomy();
  renderManage();
  render();
  showToast('已新增');
}

async function renameManagePath(field, oldPath) {
  const fieldName = field === 'category' ? '分类' : '位置';
  const parts = oldPath.split('/').map(s => s.trim()).filter(Boolean);
  const oldName = parts[parts.length - 1];
  const parentPath = parts.slice(0, -1).join('/');

  const newName = await uiPrompt(
    `重命名${fieldName}「${oldName}」`,
    oldName,
    { title: `重命名${fieldName}`, placeholder: '请输入新名称' }
  );
  if (newName === null) return;

  const trimmed = String(newName).trim();
  if (!trimmed) { showToast('名称不能为空'); return; }
  if (trimmed === oldName) return;
  if (trimmed.includes('/')) { showToast('名称中不能包含 /'); return; }

  const newPath = parentPath ? parentPath + '/' + trimmed : trimmed;

  let count = 0;
  items.forEach(i => {
    const p = (i[field] || '').trim();
    if (p === oldPath) { i[field] = newPath; count++; }
    else if (p.startsWith(oldPath + '/')) { i[field] = newPath + p.slice(oldPath.length); count++; }
  });

  const key = field === 'category' ? 'categories' : 'locations';
  taxonomy[key] = taxonomy[key].map(p => {
    if (p === oldPath) return newPath;
    if (p.startsWith(oldPath + '/')) return newPath + p.slice(oldPath.length);
    return p;
  }).filter((p, idx, self) => self.indexOf(p) === idx);

  saveTaxonomy(); saveItems(); renderManage();
  if (count) showToast(`已重命名，更新了 ${count} 个物品`);
  else showToast('已重命名');
}

async function deleteManagePath(field, path) {
  const fieldName = field === 'category' ? '分类' : '位置';
  let count = 0;
  items.forEach(i => {
    const p = (i[field] || '').trim();
    if (p === path || p.startsWith(path + '/')) count++;
  });

  const msg = count
    ? `确定删除「${displayPath(path)}」？\n${count} 个物品的${fieldName}将被清空。`
    : `确定删除「${displayPath(path)}」？`;
  const ok = await uiConfirm(msg, { title: `删除${fieldName}`, okText: '删除', danger: true });
  if (!ok) return;

  items.forEach(i => {
    const p = (i[field] || '').trim();
    if (p === path || p.startsWith(path + '/')) { i[field] = ''; }
  });

  const key = field === 'category' ? 'categories' : 'locations';
  taxonomy[key] = taxonomy[key].filter(p => p !== path && !p.startsWith(path + '/'));
  saveTaxonomy(); saveItems(); renderManage();
}

$('manageContent').addEventListener('click', e => {

  const action = btn.dataset.action;

  const path = btn.dataset.path;
  if (action === 'rename') renameManagePath(field, path);
  else if (action === 'delete') deleteManagePath(field, path);
  else if (action === 'addchild') addChildManagePath(field, path);
});

function getLastItemDefaults() {
  if (!items.length) return null;
  const sorted = [...items].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const last = sorted[0];
  return { category: last.category || '', location: last.location || '', unit: last.unit || '' };
}

function openForm(item = null, isCopy = false) {
  editingId = isCopy ? null : (item ? item.id : null);
  $('modalTitle').textContent = isCopy ? '复制物品' : (item ? '编辑物品' : '添加物品');
  $('itemId').value = editingId || '';

  const defaults = !item ? getLastItemDefaults() : null;

  if (item) {
    $('name').value = item.name;
    $('quantity').value = item.quantity;
    $('unit').value = item.unit;
    $('expiry').value = item.expiry;
    $('remindDays').value = item.remindDays;
    $('note').value = item.note;
  } else {
    $('name').value = '';
    $('quantity').value = 1;
    $('unit').value = (defaults && defaults.unit) || '个';
    $('expiry').value = '';
    $('remindDays').value = 30;
    $('note').value = '';
  }

  const catSource = item ? item.category : (defaults ? defaults.category : '');
  const [c1, c2, c3] = extractParts(catSource, CATEGORY_LEVELS);
  $('categoryL1').value = c1 || (item ? '' : (defaults ? '' : '日用品'));
  $('categoryL2').value = c2;
  $('categoryL3').value = c3;
  refreshCategoryChips();

  const locSource = item ? item.location : (defaults ? defaults.location : '');
  const [r, cab, spot] = extractParts(locSource, LOCATION_LEVELS);
  $('locationRoom').value = r;
  $('locationCabinet').value = cab;
  $('locationSpot').value = spot;
  refreshLocationChips();

  $('modal').classList.remove('hidden');
  setTimeout(() => $('name').focus(), 200);
}
function closeForm() {
  $('modal').classList.add('hidden');
  hideAllSuggests();
}
function changeQty(id, delta) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  item.quantity = Math.max(0, (Number(item.quantity) || 0) + delta);
  item.updatedAt = new Date().toISOString();
  saveItems();
}
function editItem(id) { const item = items.find(i => i.id === id); if (item) openForm(item); }
function copyItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  expandedIds.add(id);
  saveExpanded();
  openForm(item, true);
}
async function deleteItem(id) {
  const ok = await uiConfirm('确定删除这个物品？', { title: '删除物品', okText: '删除', danger: true });
  if (!ok) return;
  items = items.filter(i => i.id !== id);

}

async function batchDelete() {

function openBatchEdit(field) {

  batchEditField = field;
  const isCat = field === 'category';
  $('batchEditTitle').textContent = isCat ? '批量修改分类' : '批量修改位置';
  $('batchEditLabel').textContent = isCat ? '新分类' : '新位置';

  const paths = isCat ? allCategoryPaths() : allLocationPaths();
  const opts = Array.from(new Set(paths.flatMap(p => {
    const parts = p.split('/').map(s => s.trim()).filter(Boolean);
    const result = []; let cur = '';
    parts.forEach(part => { cur = cur ? cur + '/' + part : part; result.push(cur); });
    return result;
  }))).sort();
  renderChips($('batchEditChips'), opts, '');
  $('batchEditChips').onclick = e => {
    const btn = e.target.closest('.quick-chip');

function applyBatchEdit() {
  const val = $('batchEditInput').value.trim();
  const field = batchEditField;
  const now = new Date().toISOString();
  let count = 0;
  items.forEach(i => {
    if (selectedIds.has(i.id)) { i[field] = val; i.updatedAt = now; count++; }
  });
  if (val) {
    const arr = field === 'category' ? taxonomy.categories : taxonomy.locations;
    const parts = val.split('/').map(s => s.trim()).filter(Boolean);
    let cur = '';
    parts.forEach(p => {
      cur = cur ? cur + '/' + p : p;
      if (!arr.includes(cur)) arr.push(cur);
    });
    saveTaxonomy();
  }
  saveItems();
  $('batchEditModal').classList.add('hidden');
  showToast(`已更新 ${count} 个物品`);
}

function buildCSVContent() {
  const headers = ['名称', '分类', '位置', '数量', '单位', '到期日', '提前提醒天数', '备注', '添加时间'];
  const rows = items.map(i => [i.name, i.category, i.location, i.quantity, i.unit, i.expiry, i.remindDays, i.note, i.createdAt]);
  const csv = [headers, ...rows].map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  return '\uFEFF' + csv;
}
function buildJSONContent() {
  const data = { version: 1, exportedAt: new Date().toISOString(), items, taxonomy };
  return JSON.stringify(data, null, 2);
}
function getExportFileData(format) {
  if (format === 'csv') {
    return {
      filename: `储物清单_${localDateTimeStr()}.csv`,
      content: buildCSVContent(),
      mime: 'text/csv;charset=utf-8',
      label: 'CSV 表格',
      hint: '可用 Excel / 表格软件打开'
    };
  }
  return {
    filename: `储物清单备份_${localDateTimeStr()}.json`,
    content: buildJSONContent(),
    mime: 'application/json',
    label: 'JSON 备份',
    hint: '可完整恢复（推荐）'
  };
}

      dataPanelState.custom = null;
      renderDataPanel();
    };

  const logEl = document.getElementById('exportLog');
  function setLog(text, type) {
    if (!logEl) return;
    logEl.style.display = 'block';
    logEl.className = 'export-log' + (type ? ' ' + type : '');
    logEl.textContent = text;
  }

  // 保存到手机（安静）
  document.getElementById('btnSaveLocal').onclick = async () => {
    const fd = getCurrentFileData();
    setLog('正在保存到手机…');

    const localResult = await saveFileLocal(fd.content, fd.filename);
    if (localResult) {
      setLog('✅ 已保存到：\n' + localResult.hint + '\n\n用手机「文件管理器」进入此路径即可看到。', 'ok');
      showToast('已保存到手机');
      markExported();
      return;
    }

    // Web 兜底
    try {
      const result = await tryAllSaveMethods(fd.content, fd.filename, fd.mime);
      if (result.ok) {
        setLog('✅ 已尝试保存（' + result.method + '）。如未看到文件，请用「手动复制」。', 'ok');
        showToast('已尝试保存');
        markExported();
      } else {
        setLog('⚠️ 当前环境无法保存。请用「复制内容」或「分享文件」。', 'warn');
      }
    } catch (e) {
      setLog('⚠️ 保存失败：' + (e.message || '未知错误'), 'warn');
    }
  };

  // 分享文件
  document.getElementById('btnShareFile').onclick = async () => {
    const fd = getCurrentFileData();
    setLog('正在调起分享…');

    const uri = await shareNativeFile(fd.content, fd.filename, fd.mime);
    if (uri) {
      setLog('✅ 已保存到手机并调起分享。', 'ok');
      showToast('已分享');
      markExported();
      return;
    }

    if (typeof navigator.share === 'function') {
      try {
        const blob = new Blob([fd.content], { type: fd.mime });
        const file = new File([blob], fd.filename, { type: fd.mime });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fd.filename });
          setLog('✅ 已分享。', 'ok');
          markExported();
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') { setLog('已取消'); return; }
      }
    }

    setLog('⚠️ 当前环境不支持分享，请用「保存到手机」或「复制内容」。', 'warn');
  };

  document.getElementById('btnCopyExport').onclick = async () => {
    const fd = getCurrentFileData();

      const box = document.getElementById('manualCopyBox');
      if (box) box.open = true;

  };

  document.getElementById('btnImportHere').onclick = () => {
    modal.remove();
    const input = document.getElementById('importFile');
    if (input) input.click();
  };

  document.getElementById('btnCloseData').onclick = () => modal.remove();
}

let openAlertShown = false;
function checkNotifications() {
  const alerts = items.filter(i => ['expired', 'soon'].includes(expiryStatus(i).key));
  if (!alerts.length) return;
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('储物清单 · 到期提醒', {
        body: alerts.slice(0, 5).map(i => `${i.name}：${expiryStatus(i).label}`).join('\n')
      });
    }
  } catch (e) {}
  if (settings.alertOnOpen) showOpenAlert(alerts);
}
function showOpenAlert(alerts) {
  if (openAlertShown) return;
  openAlertShown = true;

  const expired = alerts.filter(i => expiryStatus(i).key === 'expired');
  const soon = alerts.filter(i => expiryStatus(i).key === 'soon');

  let html = '<div class="sheet-handle"></div><h2>到期提醒</h2>';
  if (expired.length) {
    html += `<h3>已过期（${expired.length}）</h3>`;
    html += expired.slice(0, 8).map(i => {
      const st = expiryStatus(i);
      return `<div class="alert-item expired" style="margin-bottom:4px;">${escapeHtml(i.name)} · ${escapeHtml(displayPath(i.location) || '未填位置')} · ${st.label}</div>`;
    }).join('');
  }
  if (soon.length) {
    html += `<h3>临期（${soon.length}）</h3>`;
    html += soon.slice(0, 8).map(i => {
      const st = expiryStatus(i);
      return `<div class="alert-item soon" style="margin-bottom:4px;">${escapeHtml(i.name)} · ${escapeHtml(displayPath(i.location) || '未填位置')} · ${st.label}</div>`;
    }).join('');
  }
  if (alerts.length > 16) html += `<p class="hint">还有 ${alerts.length - 16} 项未显示。</p>`;
  html += `<div style="margin-top:16px;">
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#6b7280; cursor:pointer; margin-bottom:12px;">
      <input type="checkbox" id="openAlertDisable" style="width:16px; height:16px; margin:0; accent-color:#3b82f6;">
      <span>以后打开 App 时不再自动提醒</span>
    </label>
    <button type="button" class="btn btn-primary btn-full" onclick="closeOpenAlert()">知道了</button>
  </div>`;

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'openAlertModal';
  modal.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(modal);
  attachSwipeClose(modal, closeOpenAlert);
}
function closeOpenAlert() {
  const cb = document.getElementById('openAlertDisable');
  if (cb && cb.checked) { settings.alertOnOpen = false; saveSettings(); }
  const m = document.getElementById('openAlertModal');
  if (m) m.remove();
}

function attachSwipeClose(modal, onClose) {
  const sheet = modal.querySelector('.sheet');
  if (!sheet || sheet.dataset.swipeAttached === '1') return;
  sheet.dataset.swipeAttached = '1';

  let startY = 0, currentY = 0, isDragging = false;
  const THRESHOLD = 100;

  sheet.addEventListener('touchstart', (e) => {
    if (sheet.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    currentY = startY;
    isDragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if (delta > 0 && sheet.scrollTop <= 0) {
      sheet.style.transform = `translateY(${delta}px)`;
      if (e.cancelable) e.preventDefault();
    } else {
      sheet.style.transform = '';
    }
  }, { passive: false });

  const endDrag = () => {
    if (!isDragging) return;
    isDragging = false;
    const delta = currentY - startY;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (delta > THRESHOLD) {
      if (typeof onClose === 'function') onClose();
      else modal.classList.add('hidden');
    }
  };

  sheet.addEventListener('touchend', endDrag);
  sheet.addEventListener('touchcancel', () => {
    isDragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
  });
}

$('itemForm').addEventListener('submit', e => {
  e.preventDefault();
  const category = joinParts([$('categoryL1').value, $('categoryL2').value, $('categoryL3').value]);
  const location = joinParts([$('locationRoom').value, $('locationCabinet').value, $('locationSpot').value]);
  const data = {
    name: $('name').value.trim(), category, location,
    quantity: Number($('quantity').value) || 0, unit: $('unit').value.trim(),
    expiry: $('expiry').value, remindDays: Number($('remindDays').value) || 0,
    note: $('note').value.trim()
  };
  if (!data.name) { showToast('请填写名称'); return; }

  if (category) {
    const parts = category.split('/').map(s => s.trim()).filter(Boolean);
    let cur = '';
    parts.forEach(p => { cur = cur ? cur + '/' + p : p; if (!taxonomy.categories.includes(cur)) taxonomy.categories.push(cur); });
  }
  if (location) {
    const parts = location.split('/').map(s => s.trim()).filter(Boolean);
    let cur = '';
    parts.forEach(p => { cur = cur ? cur + '/' + p : p; if (!taxonomy.locations.includes(cur)) taxonomy.locations.push(cur); });
  }
  saveTaxonomy();

  if (editingId) {
    const idx = items.findIndex(i => i.id === editingId);
    if (idx >= 0) items[idx] = { ...items[idx], ...data, updatedAt: new Date().toISOString() };
  } else {
    items.push({ id: uid(), ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  }
  saveItems(); closeForm(); takeSnapshot('manual'); lastSnapshotAt = Date.now();
  showToast(editingId ? '已保存' : '已添加');
});

$('importFile').addEventListener('change', e => {
  const inputEl = e.target;
  const file = inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const imported = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(imported)) throw new Error('格式不对');

      const choice = await uiDialog({
        title: '导入数据',
        message: `共 ${imported.length} 条数据。\n· 覆盖：清空当前数据后导入\n· 合并：保留现有数据，相同 ID 会被更新`,
        buttons: [
          { text: '取消', value: 'cancel' },
          { text: '合并', value: 'merge' },
          { text: '覆盖', value: 'replace', primary: true }
        ]
      });

      if (choice === 'cancel' || choice === null) {
        showToast('已取消导入');
        inputEl.value = '';
        return;
      }

      takeSnapshot('manual');

      if (choice === 'replace') {
        items = imported;
        if (data.taxonomy) {
          taxonomy = {
            categories: Array.isArray(data.taxonomy.categories) ? data.taxonomy.categories : [],
            locations: Array.isArray(data.taxonomy.locations) ? data.taxonomy.locations : []
          };
          saveTaxonomy();
        }
      } else {
        const map = new Map(items.map(i => [i.id, i]));
        imported.forEach(i => { if (!i.id) i.id = uid(); map.set(i.id, i); });
        items = Array.from(map.values());
        if (data.taxonomy) {
          if (Array.isArray(data.taxonomy.categories)) {
            data.taxonomy.categories.forEach(p => { if (!taxonomy.categories.includes(p)) taxonomy.categories.push(p); });
          }
          if (Array.isArray(data.taxonomy.locations)) {
            data.taxonomy.locations.forEach(p => { if (!taxonomy.locations.includes(p)) taxonomy.locations.push(p); });
          }
          saveTaxonomy();
        }
      }

      saveItems(); takeSnapshot('manual');
      $('menuModal').classList.add('hidden');
      showToast('导入完成');
    } catch (err) {
      showToast('导入失败：' + err.message);
    }
    inputEl.value = '';
  };
  reader.readAsText(file);
});
